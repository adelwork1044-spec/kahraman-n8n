# Kahraman n8n on Render (plan v2 م4 step 56).
#
# One paid web service (0.5 CPU, 512 MB) running the official n8n image, with its
# data (workflows, credentials, executions) in n8n's own SQLite file on a 1 GB
# persistent disk. Render snapshots the disk every 24 hours and keeps 7 days.
# The bot stays alone on the free hours.
#
# Render recommends 1c-2g ($25) for n8n. We start on 0.5c-512mb and watch memory;
# change `plan` only if n8n is slow or restarts.
#
# No secret goes in this file (the repository is public): the encryption key is
# generated by Render, and Meta/Gemini keys are entered inside n8n.

services:
  - type: web
    runtime: image
    name: kahraman-n8n
    plan: 0.5c-512mb
    region: frankfurt
    image:
      url: docker.io/n8nio/n8n:latest
    disk:
      name: n8n-data
      mountPath: /home/node/.n8n
      sizeGB: 1
    healthCheckPath: /healthz
    envVars:
      # Generated once by Render. Never change it: n8n's saved credentials are
      # encrypted with it and would be lost.
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: PORT
        value: "5678"
      # The address Meta calls. Must match the service's real onrender.com URL.
      - key: WEBHOOK_URL
        value: https://kahraman-n8n.onrender.com/
      - key: GENERIC_TIMEZONE
        value: Africa/Tripoli
      - key: TZ
        value: Africa/Tripoli
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"
      # Keep the 1 GB disk small: drop run history older than 7 days.
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "168"
      - key: DB_SQLITE_VACUUM_ON_STARTUP
        value: "true"
      # Memory under 512 MB (the service ran out once, 2026-10-31). n8n itself and the
      # Code-node runner (a second Node process) share the 512 MB, so both get a cap:
      # main 300 + runner 96 + Node's own overhead stays under the limit.
      - key: NODE_OPTIONS
        value: --max-old-space-size=300
      - key: N8N_RUNNERS_MAX_OLD_SPACE_SIZE
        value: "96"
      # Our Code nodes are tiny; two at a time is plenty and keeps the runner small.
      - key: N8N_RUNNERS_MAX_CONCURRENCY
        value: "2"
